[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "japan-stock-market-simulator"
version = "0.1.0"
description = "A probabilistic Japanese sector market generator for Unity games"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "yfinance>=0.2.40",
  "pyarrow>=12.0",
  "torch>=2.1",
]

[project.optional-dependencies]
reports = ["matplotlib>=3.7", "mplfinance>=0.12.10b0"]
onnx = ["onnx>=1.15", "onnxruntime>=1.16"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
